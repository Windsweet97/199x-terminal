<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM_ROOT // 199X TERMINAL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #030803;
      color: #00ff41;
      font-family: "Courier New", Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }
    /* 舊式映像管電視掃描線特效 */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 99999;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }
    .terminal {
      width: 100%;
      max-width: 650px;
      border: 1px solid #00ff41;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
      padding: 25px;
      background: rgba(0, 10, 2, 0.85);
      border-radius: 4px;
    }
    .header {
      font-size: 13px;
      margin-bottom: 20px;
      border-bottom: 1px dashed #00ff41;
      padding-bottom: 10px;
      color: #008f11;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
    }
    .menu-list {
      list-style: none;
      margin-top: 20px;
    }
    .menu-item {
      margin: 12px 0;
    }
    .menu-link {
      color: #00ff41;
      text-decoration: none;
      font-size: 16px;
      display: inline-block;
      transition: all 0.1s;
    }
    .menu-link:hover {
      background: #00ff41;
      color: #030803;
      padding: 0 4px;
    }
    .menu-link::before {
      content: "> ";
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #00ff41;
      animation: blink 1s infinite;
      vertical-align: middle;
      margin-left: 4px;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .footer {
      margin-top: 25px;
      font-size: 11px;
      color: #008f11;
    }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="header">
      CONNECTION: SECURE [OK] &nbsp;|&nbsp; HOST: LOCAL_NODE &nbsp;|&nbsp; USER: ROOT
    </div>
    
    <div class="title">SELECT_MODULE_DESTINATION</div>
    <p style="font-size: 13px; color: #00aa22;">請選擇您要入侵或掛載的子系統檔案：</p>

    <ul class="menu-list">
      <li class="menu-item"><a href="./galgame.html" class="menu-link">GALGAME.SYS</a></li>
      <li class="menu-item"><a href="./KAT.html" class="menu-link">KMT.DAT</a></li>
      <li class="menu-item"><a href="./A_l.html" class="menu-link">SECTION_A.LOG</a></li>
      <li class="menu-item"><a href="./B.html" class="menu-link">SECTION_B.LOG</a></li>
      <li class="menu-item"><a href="./cookie.html" class="menu-link">COOKIE_JAR.SYS</a></li>
    </ul>

    <div class="footer">
      TYPE_COMMAND_OR_CLICK<span class="cursor"></span>
    </div>
  </div>

</body>
</html>
