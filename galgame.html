<html lang="zh-Hant">
<head>

<title>GALGAME.SYS // PROTOCOL_LAIN</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        margin: 0;
        min-height: 100vh;
        background: #030803;
        color: #00ff41;
        font-family: "Courier New", Courier, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    body::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 80, 0.08), rgba(0, 255, 65, 0.04), rgba(0, 150, 255, 0.08));
        z-index: 99999;
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
        animation: warpGlitch 8s infinite steps(1);
    }

    @keyframes warpGlitch {
        0% { transform: translate(0, 0); filter: hue-rotate(0deg); }
        50% { transform: translate(-1px, 1px); filter: hue-rotate(90deg); }
        100% { transform: translate(0, 0); filter: hue-rotate(0deg); }
    }

    @keyframes wiredPulse {
        0% { background-position: 0 0, 0 0, 0 0; }
        100% { background-position: 0 50px, 50px 0, 0 0; }
    }

    @keyframes fatalGlitch {
        0% { transform: translate(0,0) scale(1); filter: invert(0); }
        20% { transform: translate(-10px, 10px) scale(1.05); filter: invert(1) hue-rotate(90deg); }
        40% { transform: translate(10px, -10px) scale(1); filter: invert(0); }
        60% { transform: translate(-10px, -5px) scale(1.02); filter: invert(1) contrast(2); }
        80% { transform: translate(10px, 10px) scale(1); filter: invert(0); }
        100% { transform: translate(0,0) scale(1); filter: hue-rotate(180deg) contrast(1.5); }
    }

    .ending-crash {
        animation: fatalGlitch 0.4s cubic-bezier(.25,.8,.25,1) forwards;
    }

    #game {
        width: min(1100px, 100vw);
        height: min(750px, 100vh);
        position: relative;
        overflow: hidden;
        background: #000a02;
        border: 1px solid #00ff41;
        box-shadow: 0 0 20px rgba(0, 255, 65, 0.25), inset 0 0 15px rgba(0, 255, 65, 0.1);
        transition: all 0.3s;
    }

    #background {
        position: absolute;
        inset: 0;
        background: 
            linear-gradient(rgba(0, 255, 65, 0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 65, 0.08) 1px, transparent 1px),
            radial-gradient(circle at 50% 50%, rgba(3, 8, 3, 0.4), rgba(0, 5, 2, 0.95));
        background-size: 40px 40px, 40px 40px, 100% 100%;
        animation: wiredPulse 20s linear infinite;
        transition: filter .5s, background .5s;
    }

    .scene-school #background { filter: hue-rotate(0deg) contrast(1.1); }
    .scene-night #background { filter: hue-rotate(280deg) contrast(1.4); }
    .scene-wired #background { filter: hue-rotate(180deg) contrast(2) invert(1); animation: wiredPulse 5s linear infinite; }
    .scene-deepwired #background { filter: hue-rotate(90deg) contrast(3) brightness(0.5); animation: wiredPulse 2s linear infinite; }

    #header-bar {
        position: absolute;
        top: 0; left: 0; right: 0; height: 32px;
        background: rgba(0, 20, 5, 0.9); border-bottom: 1px solid #00ff41;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 15px; font-size: 12px; color: #008f11; z-index: 10;
    }

    #audio-status { cursor: pointer; color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }

    #title {
        position: absolute; top: 44px; left: 25px; font-size: 18px; font-weight: bold;
        color: #00ff41; text-shadow: 0 0 8px rgba(0, 255, 65, 0.6), 0 0 15px rgba(255, 0, 255, 0.4);
        z-index: 2; letter-spacing: 2px;
    }

    /* 立繪容器：改為 bottom: 240px 提高位置 */
    #character {
        position: absolute;
        left: 50%;
        bottom: 240px;
        transform: translateX(-50%);
        display: none;
        z-index: 2;
        text-align: center;
        animation: float 4s ease-in-out infinite;
    }

    #ascii-art {
        font-family: "Courier New", Courier, monospace;
        font-size: min(9px, 1.1vw);
        line-height: 0.85;
        letter-spacing: -1px;
        color: #00ff41;
        text-shadow: 0 0 6px rgba(0, 255, 65, 0.8), 0 0 12px rgba(255, 0, 255, 0.5);
        white-space: pre;
        user-select: none;
    }

    @keyframes float {
        0%, 100% { transform: translate(-50%, 0); }
        50% { transform: translate(-50%, -8px); }
    }

    #dialogue {
        position: absolute; left: 3%; right: 3%; bottom: 20px; min-height: 150px;
        padding: 20px 25px; background: rgba(0, 10, 2, 0.92); border: 1px solid #00ff41;
        border-radius: 4px; z-index: 5; box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
    }

    #name {
        color: #ff00ff; font-weight: bold; font-size: 18px; margin-bottom: 10px;
        letter-spacing: 2px; text-shadow: 0 0 8px #ff00ff; border-bottom: 1px dashed #008f11;
        padding-bottom: 4px; display: inline-block;
    }

    #name::before { content: "ID::"; color: #008f11; }

    #text { font-size: 18px; line-height: 1.7; min-height: 58px; color: #00ff41; text-shadow: 0 0 5px rgba(0, 255, 65, 0.5); }

    .cursor {
        display: inline-block; width: 8px; height: 18px; background: #00ff41;
        animation: blink 1s infinite; vertical-align: middle; margin-left: 5px; box-shadow: 0 0 8px #00ff41;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    #choices {
        position: absolute; left: 50%; transform: translateX(-50%); bottom: 190px;
        width: min(650px, 90%); z-index: 10; display: flex; flex-direction: column; gap: 10px;
    }

    .choice {
        border: 1px solid #00ff41; border-radius: 2px; background: rgba(0, 10, 2, 0.92);
        color: #00ff41; padding: 12px 20px; font-size: 16px; font-family: "Courier New", Courier, monospace;
        cursor: pointer; transition: all 0.1s; text-align: left; box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
    }

    .choice::before { content: "> EXEC: "; color: #008f11; }
    .choice:hover { background: #00ff41; color: #030803; box-shadow: 0 0 20px rgba(0, 255, 65, 0.8); font-weight: bold; }
    .choice:hover::before { color: #030803; }

    #restart {
        display: none; position: absolute; right: 25px; top: 44px; z-index: 20;
        border: 1px solid #ff00ff; background: rgba(0, 10, 2, 0.9); color: #ff00ff;
        font-family: "Courier New", Courier, monospace; padding: 6px 14px; cursor: pointer;
        font-size: 13px; text-shadow: 0 0 5px #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.3);
    }
    #restart:hover { background: #ff00ff; color: #030803; box-shadow: 0 0 20px #ff00ff; }
</style>

/* --- 音效系統 (Web Audio API) --- */
let audioCtx;
let isAudioPlaying = false;

function initAudio() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();

    const humOsc = audioCtx.createOscillator();
    humOsc.type = 'sine'; humOsc.frequency.value = 60; 
    const humGain = audioCtx.createGain(); humGain.gain.value = 0.15;
    humOsc.connect(humGain); humGain.connect(audioCtx.destination);
    humOsc.start();

    const wireOsc = audioCtx.createOscillator();
    wireOsc.type = 'triangle'; wireOsc.frequency.value = 432;
    const wireGain = audioCtx.createGain(); wireGain.gain.value = 0.02;
    
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = 0.5;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.01;
    lfo.connect(wireGain.gain); lfo.start();

    wireOsc.connect(wireGain); wireGain.connect(audioCtx.destination);
    wireOsc.start();

    isAudioPlaying = true;
    document.getElementById("audio-status").textContent = "[ BGM: WIRED_NOISE_ACTIVE ]";
}

function playBurstNoise() {
    if (!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    const noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 2500;
    filter.Q.value = 0.8;

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(1.8, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

    noiseSource.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    noiseSource.start();
}

const textElement = document.getElementById("text");
const nameElement = document.getElementById("name");
const choicesElement = document.getElementById("choices");
const gameElement = document.getElementById("game");
const characterElement = document.getElementById("character");
const asciiElement = document.getElementById("ascii-art");
const restartButton = document.getElementById("restart");

function showScene(id) {
    const scene = story[id];

    nameElement.textContent = scene.name;
    textElement.textContent = scene.text;

    if (scene.scene === "night") gameElement.className = "scene-night";
    else if (scene.scene === "wired") gameElement.className = "scene-wired";
    else if (scene.scene === "deepwired") gameElement.className = "scene-deepwired";
    else gameElement.className = "scene-school";

    // 判斷並渲染對應的 ASCII 立繪
    if (scene.character && asciiSprites[scene.character]) {
        asciiElement.textContent = asciiSprites[scene.character];
        characterElement.style.display = "block";
    } else {
        characterElement.style.display = "none";
    }

    choicesElement.innerHTML = "";

    if (scene.choices.length === 0) {
        restartButton.style.display = "block";
        playBurstNoise();
        gameElement.classList.add("ending-crash");
        setTimeout(() => gameElement.classList.remove("ending-crash"), 500);
        return;
    }

    restartButton.style.display = "none";
    gameElement.classList.remove("ending-crash");

    scene.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = choice.text;

        button.onclick = () => {
            if (!isAudioPlaying) initAudio();
            showScene(choice.next);
        };

        choicesElement.appendChild(button);
    });
}

function startGame() {
    gameElement.classList.remove("ending-crash");
    showScene("start");
}

document.getElementById("audio-status").onclick = () => {
    if (!isAudioPlaying) initAudio();
};

startGame();
</script>
